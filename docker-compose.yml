# SKrapkin: the web interface and MongoDB.
#
#   cp .env.example .env            # then set MONGO_PASSWORD
#   docker compose up -d --build --wait   # starts MongoDB and the web interface, and waits until ready
#   open http://localhost:8080
#
# See the README for the full walkthrough.
name: skrapkin

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-skrapkin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env (copy .env.example)}
    ulimits:
      nofile: { soft: 64000, hard: 64000 }       # MongoDB's recommended open-file limit (the default 1024 is too low)
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"   # localhost only: not reachable from your network
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # The browser interface. Search CSVs are kept in a Docker volume and downloaded from the page.
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      SKRAPKIN_MONGO_URI: mongodb://${MONGO_USER:-skrapkin}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      SKRAPKIN_WEB_PASSWORD: ${SKRAPKIN_WEB_PASSWORD:-}
      SKRAPKIN_ALLOWED_HOSTS: ${SKRAPKIN_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"       # localhost only. See the README before changing this.
    volumes:
      - skrapkin-data:/data                      # search CSVs (download them from the page)
      - skrapkin-config:/config                  # settings and a Hunter key saved from the browser
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  # Headless command line (optional). Reads and writes files in ./data, which you must create first:
  #   mkdir -p data
  skrapkin:
    profiles: ["cli"]
    build:
      context: .
      target: cli
    environment:
      SKRAPKIN_MONGO_URI: mongodb://${MONGO_USER:-skrapkin}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
    volumes:
      - ./data:/data
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  skrapkin-data:
  skrapkin-config:
