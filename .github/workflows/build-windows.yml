name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name LeadScraper
          --collect-all phonenumbers --collect-submodules dns run_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: LeadScraper-windows
          path: dist/LeadScraper.exe
